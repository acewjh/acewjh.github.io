<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta http-equiv="refresh" content="0; url=https://llm-handbook.acewjh.workers.dev/">
  <link rel="canonical" href="https://llm-handbook.acewjh.workers.dev/">
  <title>正在打开大模型面试知识手册</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #f6f7f9;
      color: #111827;
    }
    main {
      width: min(520px, 100%);
      padding: 28px;
      border: 1px solid rgba(17, 24, 39, .10);
      border-radius: 18px;
      background: rgba(255, 255, 255, .94);
      box-shadow: 0 12px 36px rgba(17, 24, 39, .08);
      text-align: center;
    }
    h1 { margin: 0 0 12px; font-size: 22px; }
    p { margin: 0 0 20px; line-height: 1.7; color: #4b5563; }
    a {
      display: inline-block;
      padding: 12px 18px;
      border-radius: 12px;
      background: #111827;
      color: #fff;
      text-decoration: none;
      font-weight: 650;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0b0f17; color: #f9fafb; }
      main { background: #121826; border-color: rgba(255,255,255,.10); }
      p { color: #cbd5e1; }
      a { background: #f9fafb; color: #111827; }
    }
  </style>
  <script>
    window.location.replace('https://llm-handbook.acewjh.workers.dev/');

</head>
<body>
  <main>
    <h1>正在打开大模型面试知识手册</h1>
    <p>页面通常会自动跳转。若未跳转，请点击下方按钮。</p>
    <a href="https://llm-handbook.acewjh.workers.dev/">打开手册</a>
  </main>
</body>
</html>
